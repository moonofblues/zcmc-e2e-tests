name: Playwright tests

# Runs against the LIVE site, so it is manual or weekly only (no push/PR trigger).
on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * 0' # Sunday 22:00 UTC = Monday 06:00 Philippine time

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Read-only public specs only. Admin/apply specs need a saved login that is not in CI.
      - name: Run tests
        run: >
          npx playwright test
          tests/landing.spec.ts
          tests/landing-buttons.spec.ts
          tests/jobs.spec.ts
          tests/register.spec.ts
          tests/login.spec.ts

      - name: Job summary
        if: always()
        run: node scripts/ci-summary.mjs ci-results.json

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
